    emitCooldown = Math.max(0, emitCooldown - dt);
    if (pendingFluff >= 1.0 && emitCooldown <= 0 && activeCount < 38) {
      pendingFluff -= 1.0;
      const intensity = Math.min(1.0, globalAgitation);
      const toCamera = Math.random() < (0.48 + intensity * 0.28);
      const jitterX = Math.max(-1.0, Math.min(1.0, lastBrushX + (Math.random() - 0.5) * 0.62));
      // Rare poetic lens-crossing hero wisp: ONLY on rhythmic back-and-forth swiping (NEVER idle or single sweep) AND after 16–22s cooldown!
      const makeHero = !activeLensHero && lensCooldown <= 0 && recentReversals >= 1.8 && swipeFrequency > 0.78 && toCamera && Math.random() < 0.58;
      spawnFluff(jitterX, lastBrushY, lastBrushVx * 0.22, toCamera, intensity, makeHero);
      if (makeHero) {
        // Reserve cooldown immediately so two hero wisps can never overlap
        lensCooldown = 16.0 + Math.random() * 6.0;
        lensBlurAge = 0.0;
        lensHadBlur = false;
      }
      emitCooldown = (0.115 - intensity * 0.052) * (0.72 + Math.random() * 0.56);
    } else if (pendingFluff > 0) {
      pendingFluff = Math.max(0, pendingFluff - dt * 1.1);
    }

    // Gentle idle ambient breeze detaches an occasional solitary wisp (NEVER triggers lens blur!)
    if (activeCount < 8 && Math.random() < dt * 0.45) {
      spawnFluff((Math.random() - 0.5) * 1.6, 0.06 + Math.random() * 0.42, 0.14, Math.random() < 0.24, 0.0, false);
    }

    // Authentic featherweight reed-fluff aerodynamics + hero lens-pass optical focus-pull tracking
    let targetLensBlur = 0.0;
    const focal = 1.48;
    for (let i = 0; i < MAX_FLUFF; i++) {
      const p = fluffList[i];
      if (!p.active) continue;
      p.age += dt;
      if (p.age >= p.life || p.z < 0.15) {
        p.active = false;
        p.isLensHero = false;
        continue;
      }
      const s = p.seed * 31.4;
      if (p.isLensHero) {
        const distZ = Math.max(0.20, p.z);
        const scX = distZ * aspect / focal;
        const scY = distZ / focal;
        const steerX = (p.goalX - p.x) * 1.12 + Math.sin(t * 1.05 + s) * 0.15 * scX;
        const steerY = (p.goalY - p.y) * 1.12 + Math.cos(t * 0.88 + s) * 0.11 * scY;
        p.vx += (steerX - p.vx * 1.75) * dt;
        p.vy += (steerY - p.vy * 1.75) * dt;
        // Air-cushion deceleration: steady visible glide from reeds -> gentle unhurried float across the lens glass
        const targetVz = p.z > 0.88 ? -0.58 : -0.40;
        p.vz += (targetVz - p.vz * 0.95) * dt;
      } else {
        const eddyX = Math.sin(t * 0.92 + p.y * 2.2 + s) * 0.28
                    + Math.cos(t * 1.68 + p.z * 1.7 + s * 1.3) * 0.10 + 0.10;
        const eddyY = Math.cos(t * 0.78 + p.x * 1.8 + s) * 0.18
                    + Math.sin(t * 1.42 + s * 0.7) * 0.06 + 0.055;
        p.vx += (eddyX - p.vx * 1.45) * dt;
        p.vy += (eddyY - p.vy * 1.35) * dt;
        if (p.cameraBound) {
          const zEddy = -0.46 - 0.18 * Math.sin(t * 0.85 + s);
          p.vz += (zEddy - p.vz * 0.92) * dt;
        }
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      p.rot += (p.vrot * 0.55 + Math.sin(t * 1.35 + s) * 0.42) * dt;

      // Focus pulls ONLY once the visibly approaching hero wisp enters macro foreground (z < 0.86 -> 0.18)
      if (p.isLensHero && p.z < 0.86 && p.z > 0.18) {
        const clipX = p.x * focal / (p.z * aspect);
        const clipY = p.y * focal / p.z;
        const uvX = clipX * 0.5 + 0.5;
        const uvY = clipY * 0.5 + 0.5;
        if (uvX > 0.04 && uvX < 0.96 && uvY > 0.04 && uvY < 0.96 && lensBlurAge < 2.4) {
          lensBlurAge += dt;
          lensHadBlur = true;
          lensPosX += (uvX - lensPosX) * Math.min(1, dt * 6.5);
          lensPosY += (uvY - lensPosY) * Math.min(1, dt * 6.5);
          // Zero-slope S-curve bell (sin^2.15): whisper-soft onset as fluff nears lens, creamy peak at macro pass, silky return!
          const zProg = Math.max(0, Math.min(1, (0.86 - p.z) / 0.68));
          const zBell = Math.pow(Math.sin(zProg * Math.PI), 2.15);
          const timeCap = Math.min(1, Math.max(0, (2.4 - lensBlurAge) / 0.60));
          targetLensBlur = Math.max(targetLensBlur, zBell * timeCap * 0.88);
        }
      }
    }

    // Gentle cinema-prime autofocus breathing smoothly out & pulling crisp focus right back in
    const easeRate = targetLensBlur > lensBlur ? 2.6 : 2.1;
    lensBlur += (targetLensBlur - lensBlur) * Math.min(1, dt * easeRate);
    if (lensBlur < 0.002) lensBlur = 0.0;
    if (lensHadBlur && targetLensBlur === 0 && lensBlur < 0.02) {
      // Lock out for 16–22s AFTER the blur finishes so the scene stays clear almost all the time!
      lensCooldown = Math.max(lensCooldown, 16.0 + Math.random() * 6.0);
      lensHadBlur = false;
    }
  }

  function packFluffBuffers() {
    let midCount = 0, nearCount = 0;
    const active = [];
    for (let i = 0; i < MAX_FLUFF; i++) { if (fluffList[i].active) active.push(fluffList[i]); }
    active.sort((a, b) => b.z - a.z);

    for (let i = 0; i < active.length; i++) {
      const p = active[i];
      const fadeIn = Math.min(1, p.age / 0.32);
      const fadeOut = Math.min(1, (1 - p.age / p.life) / 0.32);
      const lensFade = Math.min(1, Math.max(0, (p.z - 0.15) / 0.22));
      const alpha = fadeIn * fadeOut * lensFade;
      if (alpha <= 0.01) continue;

      const isNear = p.z < 1.55;
      const arr = isNear ? fluffNearData : fluffMidData;
      let offset = (isNear ? nearCount : midCount) * 6 * FLUFF_STRIDE;
      for (let c = 0; c < 6; c++) {
        arr[offset++] = CORNERS[c][0]; arr[offset++] = CORNERS[c][1];
        arr[offset++] = p.x; arr[offset++] = p.y; arr[offset++] = p.z;
        arr[offset++] = p.size; arr[offset++] = p.rot; arr[offset++] = alpha; arr[offset++] = p.seed;
      }
      if (isNear) nearCount++; else midCount++;
    }
    return { midCount, nearCount };
  }

  function packSparkles(t) {
    const sunX = aspect < 1.0 ? 0.57 : 0.62;
    const sunY = aspect < 1.0 ? 0.75 : 0.73;
    let offset = 0;
    let visibleCount = 0;

    // 4 unhurried, widely separated sunlight glints with quiet breathing pauses
    // (Typically only 1–2 delicate glints twinkle gently at any moment — never crowded!)
    const periods = [5.4, 6.2, 5.8, 6.9];
    const phases  = [0.4, 2.3, 4.1, 1.2];

    for (let i = 0; i < NUM_SPARKLES; i++) {
      const period = periods[i];
      const tSlot  = (t + phases[i]) / period;
      const cycle  = Math.floor(tSlot);
      const uRaw   = tSlot - cycle;

      // Active twinkle occupies first 58% of cycle; silent rest during remaining 42%
      if (uRaw > 0.58) continue;
      const u = uRaw / 0.58;

      const lifeEnv = Math.pow(Math.sin(u * Math.PI), 1.85);
      const shimmer = 0.78 + 0.22 * Math.sin(t * (4.6 + i * 0.8) + cycle * 4.1);
      const env = lifeEnv * shimmer * (0.86 + 0.22 * globalAgitation) * (1.0 - lensBlur * 0.55);
      if (env < 0.015) continue;

      const rx = hash1(cycle * 19.3 + i * 11.7 + 1.3);
      const ry = hash1(cycle * 31.7 + i * 17.3 + 5.7);
      const rs = hash1(cycle * 11.1 + i * 23.3 + 9.2);

      // Keep the 4 glints in distinct, non-overlapping zones of the painting!
      let px, py;
      if (i === 0) {
        // Gentle glint near the warm watercolor sun's rim
        const ang = rx * Math.PI * 2;
        const rad = 0.09 + ry * 0.13;
        px = Math.max(0.14, Math.min(0.86, sunX + Math.cos(ang) * rad / Math.max(aspect, 0.65)));
        py = Math.max(0.58, Math.min(0.90, sunY + Math.sin(ang) * rad * 0.72));
      } else if (i === 1) {
        // Left-side sunlit reed plume
        px = 0.12 + rx * 0.34;
        py = 0.34 + ry * 0.26;
      } else if (i === 2) {
        // Right-side sunlit reed plume
        px = 0.54 + rx * 0.34;
        py = 0.34 + ry * 0.26;
      } else {
        // Delicate sunlight glint dancing along the shallow blue waterline
        px = 0.14 + rx * 0.72;
        py = 0.13 + ry * 0.10;
      }

      px += (u - 0.5) * 0.014;
      py += Math.sin(u * Math.PI) * 0.006;

      const size = (0.013 + rs * 0.014) * (0.68 + 0.48 * lifeEnv) * (1.0 + 0.12 * globalAgitation);
      const rot = (rx - 0.5) * 0.24 + u * 0.18;

      for (let c = 0; c < 6; c++) {
        sparkData[offset++] = CORNERS[c][0];
        sparkData[offset++] = CORNERS[c][1];
        sparkData[offset++] = px;
        sparkData[offset++] = py;
        sparkData[offset++] = size;
        sparkData[offset++] = rot;
        sparkData[offset++] = env;
      }
      visibleCount++;
    }
    return visibleCount;
  }

  const skyLocs     = { aPos: gl.getAttribLocation(skyProg, 'aPos'), uTime: gl.getUniformLocation(skyProg, 'uTime'), uAspect: gl.getUniformLocation(skyProg, 'uAspect'), uAgitation: gl.getUniformLocation(skyProg, 'uAgitation') };
  const waterLocs   = { aPos: gl.getAttribLocation(waterProg, 'aPos'), uTime: gl.getUniformLocation(waterProg, 'uTime'), uAspect: gl.getUniformLocation(waterProg, 'uAspect') };
  const reedLocs    = { aBase: gl.getAttribLocation(reedProg, 'aBase'), aMeta: gl.getAttribLocation(reedProg, 'aMeta'), aShape: gl.getAttribLocation(reedProg, 'aShape'), uTime: gl.getUniformLocation(reedProg, 'uTime'), uAspect: gl.getUniformLocation(reedProg, 'uAspect'), uAgitation: gl.getUniformLocation(reedProg, 'uAgitation'), uFieldTex: gl.getUniformLocation(reedProg, 'uFieldTex') };
  const plumeLocs   = { aBase: gl.getAttribLocation(plumeProg, 'aBase'), aMeta: gl.getAttribLocation(plumeProg, 'aMeta'), aQuad: gl.getAttribLocation(plumeProg, 'aQuad'), uTime: gl.getUniformLocation(plumeProg, 'uTime'), uAspect: gl.getUniformLocation(plumeProg, 'uAspect'), uAgitation: gl.getUniformLocation(plumeProg, 'uAgitation'), uFieldTex: gl.getUniformLocation(plumeProg, 'uFieldTex') };
  const fluffLocs   = { aCorner: gl.getAttribLocation(fluffProg, 'aCorner'), aPos3D: gl.getAttribLocation(fluffProg, 'aPos3D'), aInfo: gl.getAttribLocation(fluffProg, 'aInfo'), uAspect: gl.getUniformLocation(fluffProg, 'uAspect'), uFluffTex: gl.getUniformLocation(fluffProg, 'uFluffTex') };
  const postLocs    = { aPos: gl.getAttribLocation(postProg, 'aPos'), uScene: gl.getUniformLocation(postProg, 'uScene'), uPaper: gl.getUniformLocation(postProg, 'uPaper'), uRes: gl.getUniformLocation(postProg, 'uRes'), uLensBlur: gl.getUniformLocation(postProg, 'uLensBlur'), uLensPos: gl.getUniformLocation(postProg, 'uLensPos') };
  const sparkLocs   = { aCorner: gl.getAttribLocation(sparkleProg, 'aCorner'), aSpark: gl.getAttribLocation(sparkleProg, 'aSpark'), aEnv: gl.getAttribLocation(sparkleProg, 'aEnv'), uAspect: gl.getUniformLocation(sparkleProg, 'uAspect') };

  function drawFluffBatch(data, count) {
    if (count === 0) return;
    gl.useProgram(fluffProg);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fluffTex);
    gl.uniform1i(fluffLocs.uFluffTex, 1);
    gl.uniform1f(fluffLocs.uAspect, aspect);
    gl.bindBuffer(gl.ARRAY_BUFFER, FLUFF_BUF);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, count * 6 * FLUFF_STRIDE));
    const stride = FLUFF_STRIDE * 4;
    gl.enableVertexAttribArray(fluffLocs.aCorner);
    gl.enableVertexAttribArray(fluffLocs.aPos3D);
    gl.enableVertexAttribArray(fluffLocs.aInfo);
    gl.vertexAttribPointer(fluffLocs.aCorner, 2, gl.FLOAT, false, stride, 0);
    gl.vertexAttribPointer(fluffLocs.aPos3D,  3, gl.FLOAT, false, stride, 8);
    gl.vertexAttribPointer(fluffLocs.aInfo,   4, gl.FLOAT, false, stride, 20);
    gl.drawArrays(gl.TRIANGLES, 0, count * 6);
    gl.disableVertexAttribArray(fluffLocs.aCorner);
    gl.disableVertexAttribArray(fluffLocs.aPos3D);
    gl.disableVertexAttribArray(fluffLocs.aInfo);
  }

  function drawSparkles(count) {
    if (count === 0) return;
    gl.useProgram(sparkleProg);
    gl.uniform1f(sparkLocs.uAspect, aspect);
    gl.bindBuffer(gl.ARRAY_BUFFER, SPARK_BUF);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, sparkData.subarray(0, count * 6 * SPARK_STRIDE));
    const stride = SPARK_STRIDE * 4;
    gl.enableVertexAttribArray(sparkLocs.aCorner);
    gl.enableVertexAttribArray(sparkLocs.aSpark);
    gl.enableVertexAttribArray(sparkLocs.aEnv);
    gl.vertexAttribPointer(sparkLocs.aCorner, 2, gl.FLOAT, false, stride, 0);
    gl.vertexAttribPointer(sparkLocs.aSpark,  4, gl.FLOAT, false, stride, 8);
    gl.vertexAttribPointer(sparkLocs.aEnv,    1, gl.FLOAT, false, stride, 24);
    gl.drawArrays(gl.TRIANGLES, 0, count * 6);
    gl.disableVertexAttribArray(sparkLocs.aCorner);
    gl.disableVertexAttribArray(sparkLocs.aSpark);
    gl.disableVertexAttribArray(sparkLocs.aEnv);
  }

  let prevTime = performance.now();
  let smoothDt = 0.016;
  function render(now) {
    requestAnimationFrame(render);
    const rawDt = Math.min(0.033, Math.max(0.002, (now - prevTime) / 1000));
    prevTime = now;
    smoothDt += (rawDt - smoothDt) * 0.25;
    const t = now * 0.001;

    updatePhysics(smoothDt, t);
    const { midCount, nearCount } = packFluffBuffers();
    const sparkCount = packSparkles(t);

    // PASS 1: Render pastel scene onto FBO
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO);
    gl.viewport(0, 0, fbWidth, fbHeight);
    gl.disable(gl.BLEND);

    gl.useProgram(skyProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, QUAD_BUF);
    gl.enableVertexAttribArray(skyLocs.aPos);
    gl.vertexAttribPointer(skyLocs.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.uniform1f(skyLocs.uTime, t);
    gl.uniform1f(skyLocs.uAspect, aspect);
    gl.uniform1f(skyLocs.uAgitation, globalAgitation);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.disableVertexAttribArray(skyLocs.aPos);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fieldTex);

    for (let layer = 0; layer < 4; layer++) {
      gl.useProgram(reedProg);
      gl.uniform1i(reedLocs.uFieldTex, 0);
      gl.uniform1f(reedLocs.uTime, t);
      gl.uniform1f(reedLocs.uAspect, aspect);
      gl.uniform1f(reedLocs.uAgitation, globalAgitation);
      gl.bindBuffer(gl.ARRAY_BUFFER, REED_BUF);
      gl.enableVertexAttribArray(reedLocs.aBase);
      gl.enableVertexAttribArray(reedLocs.aMeta);
      gl.enableVertexAttribArray(reedLocs.aShape);
      gl.vertexAttribPointer(reedLocs.aBase,  3, gl.FLOAT, false, 44, 0);
      gl.vertexAttribPointer(reedLocs.aMeta,  4, gl.FLOAT, false, 44, 12);
      gl.vertexAttribPointer(reedLocs.aShape, 4, gl.FLOAT, false, 44, 28);
      gl.drawArrays(gl.TRIANGLES, reedRanges[layer].start, reedRanges[layer].count);
      gl.disableVertexAttribArray(reedLocs.aBase);
      gl.disableVertexAttribArray(reedLocs.aMeta);
      gl.disableVertexAttribArray(reedLocs.aShape);

      if (plumeRanges[layer].count > 0) {
        gl.useProgram(plumeProg);
        gl.uniform1i(plumeLocs.uFieldTex, 0);
        gl.uniform1f(plumeLocs.uTime, t);
        gl.uniform1f(plumeLocs.uAspect, aspect);
        gl.uniform1f(plumeLocs.uAgitation, globalAgitation);
        gl.bindBuffer(gl.ARRAY_BUFFER, PLUME_BUF);
        gl.enableVertexAttribArray(plumeLocs.aBase);
        gl.enableVertexAttribArray(plumeLocs.aMeta);
        gl.enableVertexAttribArray(plumeLocs.aQuad);
        gl.vertexAttribPointer(plumeLocs.aBase, 3, gl.FLOAT, false, 44, 0);
        gl.vertexAttribPointer(plumeLocs.aMeta, 4, gl.FLOAT, false, 44, 12);
        gl.vertexAttribPointer(plumeLocs.aQuad, 4, gl.FLOAT, false, 44, 28);
        gl.drawArrays(gl.TRIANGLES, plumeRanges[layer].start, plumeRanges[layer].count);
        gl.disableVertexAttribArray(plumeLocs.aBase);
        gl.disableVertexAttribArray(plumeLocs.aMeta);
        gl.disableVertexAttribArray(plumeLocs.aQuad);
      }

      if (layer === 2) {
        drawFluffBatch(fluffMidData, midCount);
      }
    }

    // Translucent chalky sky-blue shallow water veil + coral waterline ribbon
    gl.useProgram(waterProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, QUAD_BUF);
    gl.enableVertexAttribArray(waterLocs.aPos);
    gl.vertexAttribPointer(waterLocs.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.uniform1f(waterLocs.uTime, t);
    gl.uniform1f(waterLocs.uAspect, aspect);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.disableVertexAttribArray(waterLocs.aPos);

    // PASS 2: Ultra-fast Zero-Loop Cold-Press Watercolor Paper + Dry Pastel Stipple
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, fbWidth, fbHeight);
    gl.disable(gl.BLEND);

    gl.useProgram(postProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneTex);
    gl.uniform1i(postLocs.uScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, paperTex);
    gl.uniform1i(postLocs.uPaper, 1);
    gl.uniform2f(postLocs.uRes, fbWidth, fbHeight);
    gl.uniform1f(postLocs.uLensBlur, lensBlur);
    gl.uniform2f(postLocs.uLensPos, lensPosX, lensPosY);
    gl.bindBuffer(gl.ARRAY_BUFFER, QUAD_BUF);
    gl.enableVertexAttribArray(postLocs.aPos);
    gl.vertexAttribPointer(postLocs.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.disableVertexAttribArray(postLocs.aPos);

    // PASS 3: Zero-overhead Dynamic Sunlight Sparkles + Foreground Velvety Hazy Fluff
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawSparkles(sparkCount);
    drawFluffBatch(fluffNearData, nearCount);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
